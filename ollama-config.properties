# Configuration pour l'intégration Ollama
# Ce fichier permet de personnaliser les paramètres de connexion à Ollama

# URL de base pour le service Ollama
ollama.base.url=http://localhost:11434

# Nom du modèle LLM à utiliser
ollama.model.name=llama3.2:latest

# Timeout pour les requêtes (en secondes)
ollama.timeout.seconds=120

# Prompt système pour l'analyse des demandes de voyage
ollama.system.prompt=You are a travel request analyzer. Extract travel information from user requests and return ONLY a JSON object with these exact fields: {"from": "departure_location", "to": "destination_location", "time": "HHMM_format", "transport_type": "bus|car|bike|tram|any", "criteria": "cost|co2|confort|duration|duration-cost"} Map locations to these codes: a=station_a, b=station_b, c=station_c, d=station_d, e=station_e, f=station_f. If any information is missing, use reasonable defaults: time=0800, transport_type=any, criteria=cost. Return ONLY valid JSON, no additional text.

# Messages d'interface utilisateur
interface.prompt.label=Décrivez votre besoin de transport en langage naturel
interface.button.text=🤖 Analyser avec l'IA
interface.loading.message=🤖 Analyse de votre demande en cours...
interface.error.ollama.unavailable=Ollama n'est pas disponible. Utilisez les contrôles manuels.
interface.error.parsing.failed=Erreur d'analyse de la demande. Veuillez reformuler ou utiliser les contrôles manuels.

# Exemples à afficher dans l'interface
interface.examples=Je veux aller de a vers c à 9h en bus, option économique|Trajet rapide de b vers f en vélo après 14h|Transport confortable de d à e en tram vers 8h

# Activation/désactivation des fonctionnalités
feature.ollama.enabled=true
feature.weather.integration=true
feature.transport.type.filter=true
feature.fallback.manual.controls=true

# Debug et logging
debug.show.ai.responses=true
debug.show.extracted.parameters=true
debug.log.requests=false